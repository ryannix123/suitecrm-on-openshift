name: Build and Push SuiteCRM Container

on:
  # Weekly build every Monday at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * 1'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      suitecrm_version:
        description: 'SuiteCRM version to build (e.g., 8.10.1)'
        required: false
        default: ''
  
  # Build on pushes to main
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'entrypoint.sh'
      - 'nginx.conf'
      - 'default.conf'
      - 'www.conf'
      - '99-suitecrm.ini'
      - 'supervisord.conf'
      - '.github/workflows/build.yml'

env:
  REGISTRY: quay.io
  IMAGE_NAME: ryan_nix/suitecrm-openshift

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine SuiteCRM version
        id: version
        run: |
          # Use manual input if provided
          if [ -n "${{ github.event.inputs.suitecrm_version }}" ]; then
            VERSION="${{ github.event.inputs.suitecrm_version }}"
            echo "Using manually specified version: ${VERSION}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check latest release from GitHub API
          LATEST=$(curl -s https://api.github.com/repos/SuiteCRM/SuiteCRM-Core/releases/latest | \
                   jq -r '.tag_name' | sed 's/^v//')
          echo "Latest SuiteCRM release: ${LATEST}"

          # Get current version from Containerfile
          CURRENT=$(grep '^ARG SUITECRM_VERSION=' Containerfile | cut -d= -f2)
          echo "Current Containerfile version: ${CURRENT}"

          echo "version=${LATEST}" >> $GITHUB_OUTPUT

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "New version detected!"
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Rebuilding current version (scheduled/push build)"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "No new version, skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set version variable
        id: vars
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major_minor=${MAJOR_MINOR}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SUITECRM_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.major_minor }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Containerfile version
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          CURRENT=$(grep '^ARG SUITECRM_VERSION=' Containerfile | cut -d= -f2)
          
          if [ "$VERSION" != "$CURRENT" ]; then
            sed -i "s/ARG SUITECRM_VERSION=.*/ARG SUITECRM_VERSION=${VERSION}/" Containerfile
            sed -i "s/version=\"[0-9.]*\"/version=\"${VERSION}\"/" Containerfile
            sed -i "s/SuiteCRM 8\.[0-9]*/SuiteCRM ${VERSION%.*}/" Containerfile
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Containerfile
            git commit -m "chore: bump SuiteCRM to ${VERSION}" || echo "No changes to commit"
            git push || echo "Nothing to push"
          fi

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **SuiteCRM Version:** ${{ steps.vars.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** \`${{ steps.vars.outputs.version }}\`, \`${{ steps.vars.outputs.major_minor }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** linux/amd64" >> $GITHUB_STEP_SUMMARY